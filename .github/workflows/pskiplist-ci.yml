name: pskiplist CI

on:
  push:
    branches: [ main, master ]
    paths: [ 'implementation/pskiplist/**', '.github/workflows/pskiplist-ci.yml' ]
  pull_request:
    branches: [ main, master ]
    paths: [ 'implementation/pskiplist/**', '.github/workflows/pskiplist-ci.yml' ]

defaults:
  run:
    working-directory: implementation/pskiplist

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang++, g++]

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake clang clang-format clang-tidy python3-pip
        pip install --user quom
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Verify code formatting
      run: |
        find include/pskiplist tests examples \( -name "*.cpp" -o -name "*.hpp" \) \
          -not -path "include/pskiplist/pskiplist.hpp" -print0 \
          | xargs -0 clang-format --dry-run --Werror

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release

    - name: Run clang-tidy static analysis
      if: matrix.compiler == 'clang++'
      run: cmake --build build --target clang-tidy-check

    - name: Build
      run: cmake --build build --config Release

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitize: [thread, "address,undefined"]

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake clang python3-pip
        pip install --user quom
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_BUILD_TYPE=Debug \
          -DPSKIPLIST_SANITIZE=${{ matrix.sanitize }}

    - name: Build
      run: cmake --build build --target test_pskiplist

    - name: Run tests
      # tsan_suppressions.txt: read_value()/write_value_locked()'s seqlock does a plain
      # (non-atomic) read/write of each node's value, by design -- see that file's own comment.
      # No effect on the address,undefined job (TSAN_OPTIONS is simply unused there).
      run: TSAN_OPTIONS="suppressions=${{ github.workspace }}/implementation/pskiplist/tsan_suppressions.txt" ctest --test-dir build --output-on-failure
