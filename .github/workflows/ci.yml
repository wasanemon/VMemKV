name: C/C++ CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang++, g++]

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          clang \
          clang-format \
          clang-tidy \
          librocksdb-dev \
          liblmdb-dev \
          gdb

    - name: Verify Code Formatting
      run: |
        # Run clang-format dry-run to check for style violations in C++ files
        find implementation/src implementation/tests implementation/benchmark \( -name "*.cpp" -o -name "*.hpp" \) -print0 | xargs -0 clang-format --dry-run --Werror

    - name: Configure CMake
      run: |
        cmake -S implementation -B build \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_WARN_DEPRECATED=OFF \
          -DENABLE_ROCKSDB=ON \
          -DENABLE_LMDB=ON

    - name: Run clang-tidy Static Analysis
      if: matrix.compiler == 'clang++'
      run: |
        cmake --build build --target clang-tidy-check

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Run Tests
      run: |
        cd build
        # Watchdog: 300s is generously past this suite's normal ~1-2min runtime but well short of
        # ctest's own TIMEOUT below, so if test_kv_store is still alive at that point, it's stuck,
        # not just slow -- dump every thread's backtrace via gdb before ctest's TIMEOUT kills it,
        # since a killed process's buffered stdout is otherwise lost with no way to inspect it.
        ( sleep 300
          for pid in $(pgrep -f 'tests/test_kv_store'); do
            echo "=== WATCHDOG: test_kv_store (pid $pid) still running after 300s -- dumping backtraces ==="
            sudo gdb -p "$pid" -batch -ex "thread apply all bt" -ex detach || true
          done
        ) &
        watchdog_pid=$!
        ctest --output-on-failure
        ctest_exit=$?
        kill "$watchdog_pid" 2>/dev/null || true
        exit "$ctest_exit"
